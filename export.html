<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d3e">
  <title>AR Dino: save 3D models</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/export.css">

  <script src="./lib/aframe/aframe.min.js"></script>
  <script src="./js/core/model-formats.js"></script>
  <script src="./js/models/dino-model.js"></script>
  <script src="./js/models/chick-model.js"></script>
  <script src="./js/utils/model-export.js"></script>
  <script src="./js/export/export-page.js"></script>
</head>

<body>
  <main class="export-panel">
    <h1>Save a 3D model</h1>

    <label class="field">Animal
      <select id="animal"></select>
    </label>

    <label class="field">STL size: longest side in millimeters
      <input id="size-mm" type="number" inputmode="decimal" min="10" max="400" step="5" value="100">
    </label>

    <div class="export-buttons">
      <button id="btn-glb" type="button" class="btn btn-primary">GLB</button>
      <button id="btn-obj" type="button" class="btn">OBJ + MTL</button>
      <button id="btn-stl" type="button" class="btn">STL</button>
    </div>

    <div id="export-status" class="status" role="status" aria-live="polite"></div>
    <a href="./index.html">Back to AR Dino</a>
  </main>

  <a-scene xr-mode-ui="enabled: false" vr-mode-ui="enabled: false" loading-screen="enabled: false"
           renderer="antialias: true">
    <a-entity camera="fov: 50" position="0 0.45 1.5" rotation="-10 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.95"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="1 4 2"></a-entity>
    <a-sky color="#dff5e6"></a-sky>
    <a-circle rotation="-90 0 0" radius="0.9" color="#b6f2c8" position="0 -0.001 0"></a-circle>
    <a-entity id="preview-model" spin="speed: 25"></a-entity>
  </a-scene>
</body>
</html>
