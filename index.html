<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d3e">
  <title>AR Dino</title>
  <link rel="stylesheet" href="./css/style.css">

  <!-- 1. Compat shims and diagnostics: always first, classic scripts -->
  <script src="./js/compat/xr-compat.js"></script>
  <script src="./js/debug/xr-diagnostics.js"></script>

  <!-- 2. Framework (vendored, pinned): created by `npm run vendor` -->
  <script src="./lib/aframe/aframe.min.js"></script>

  <!-- 3. App config, pure logic, services -->
  <script src="./js/config.js"></script>
  <script src="./js/core/dino-core.js"></script>
  <script src="./js/utils/dino-voice.js"></script>
  <script src="./js/models/dino-model.js"></script>

  <!-- 4. Systems and components: each file only registers -->
  <script src="./js/systems/app-state.js"></script>
  <script src="./js/components/touch-gestures.js"></script>
  <script src="./js/components/surface-placement.js"></script>
  <script src="./js/components/preview-backdrop.js"></script>
  <script src="./js/components/cute-dino.js"></script>
  <script src="./js/components/dino-controller.js"></script>

  <!-- 5. UI + bootstrap -->
  <script src="./js/ui/overlay.js"></script>
  <script src="./js/main.js" defer></script>
</head>

<body>
  <!-- DOM overlay (also shown inside the AR session). Lives OUTSIDE the scene. -->
  <div id="overlay" class="overlay">
    <div id="touch-layer" class="touch-layer is-hidden"></div>

    <section id="start-screen" class="start-screen">
      <div class="start-card">
        <div class="start-emoji" aria-hidden="true">🦖</div>
        <h1>AR Dino</h1>
        <p class="lead">Put a tiny, very dramatic dinosaur on your floor.</p>
        <label class="animal-picker" for="animal-select">
          <span>Dinosaur</span>
          <select id="animal-select"></select>
        </label>
        <button id="btn-start-ar" type="button" class="btn btn-primary btn-wide">Start AR</button>
        <button id="btn-preview" type="button" class="btn btn-wide">Preview without AR</button>
        <p id="support-note" class="note" role="status"></p>
        <p class="note">Camera images stay on your device.</p>
        <a class="link" href="./export.html">Download the 3D model (GLB, STL, OBJ)</a>
      </div>
    </section>

    <div id="hud" class="hud is-hidden">
      <div class="hud-top">
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <button id="btn-mute" type="button" class="btn btn-round" aria-label="Mute sound" aria-pressed="false">🔊</button>
        <button id="btn-exit" type="button" class="btn btn-round" aria-label="Exit">✕</button>
      </div>

      <div class="hud-bottom">
        <button id="btn-place" type="button" class="btn btn-primary btn-wide is-hidden">Place dino here</button>
        <div id="tools" class="tools is-hidden">
          <button id="btn-roar" type="button" class="btn">Roar</button>
          <button id="btn-smaller" type="button" class="btn btn-round" aria-label="Smaller">−</button>
          <button id="btn-bigger" type="button" class="btn btn-round" aria-label="Bigger">+</button>
          <button id="btn-rot-left" type="button" class="btn btn-round" aria-label="Rotate left">⟲</button>
          <button id="btn-rot-right" type="button" class="btn btn-round" aria-label="Rotate right">⟳</button>
          <button id="btn-move" type="button" class="btn">New spot</button>
          <label class="animal-picker hud-animal-picker" for="animal-select-live">
            <span>Dinosaur</span>
            <select id="animal-select-live"></select>
          </label>
        </div>
      </div>
    </div>
  </div>

  <a-scene
    webxr="optionalFeatures: local-floor, hit-test, dom-overlay; overlayElement: #overlay"
    renderer="antialias: true"
    xr-mode-ui="enabled: false"
    loading-screen="enabled: false"
    touch-gestures="target: #touch-layer"
    device-orientation-permission-ui>

    <!-- Camera: in AR the phone pose drives it. In preview, device motion drives it (no touch/mouse drag,
         because our own gestures own those inputs). -->
    <a-entity camera look-controls="touchEnabled: false; mouseEnabled: false" wasd-controls="enabled: false"></a-entity>

    <!-- Light: AR shows the real world, so only simple lights are needed -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 0.95"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="1 4 2"></a-entity>

    <!-- Preview-only scenery -->
    <a-entity id="preview-set" preview-backdrop>
      <a-sky color="#bfe6ff" radius="60"></a-sky>
    </a-entity>

    <!-- Surface reticle (AR) and the star of the show -->
    <a-entity id="reticle" surface-placement></a-entity>
    <a-entity id="dino" cute-dino dino-controller="reticle: #reticle">
      <a-entity id="imported-model"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
